services:
  app:
    build: .
    container_name: bookstore-app-microservices
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/bookstore
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - bookstore-network

  db:
    image: mariadb:latest
    container_name: bookstore-db-microservices
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: bookstore
    ports:
      - "3308:3307" # Exposing on port 3308 to avoid conflict if local MariaDB is running on 3306
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bookstore-network:
    driver: bridge

volumes:
  db_data:
