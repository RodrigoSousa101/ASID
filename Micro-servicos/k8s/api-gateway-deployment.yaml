apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: asid/api-gateway:local
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: "api-gateway"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318"
            - name: BOOK_SERVICE_URL
              value: "http://book-service:8082"
            - name: CART_SERVICE_URL
              value: "http://cart-service:8083"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8084"
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8085"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
