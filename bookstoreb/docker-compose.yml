services:
  bookstore-app:
    build:
      context: .
    container_name: bookstore-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://bookstore-db:3306/bookstore
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      bookstore-db:
        condition: service_healthy
    networks:
      - bookstore-net

  bookstore-db:
    image: mariadb:11
    container_name: bookstore-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: bookstore
    ports:
      - "3306:3306"
    volumes:
      - bookstore-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bookstore-net

volumes:
  bookstore-db-data:

networks:
  bookstore-net:
    driver: bridge